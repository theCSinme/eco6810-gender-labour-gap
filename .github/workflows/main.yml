
name: Run Gender Labour Gap Analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "data/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project dependencies
        run: uv sync

      - name: Run analysis
        run: uv run main.py

      - name: Upload analysis outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gender-lab-analysis-outputs
          path: |
            outputs/
            data/country_year_gender_gap.csv
          if-no-files-found: warn
